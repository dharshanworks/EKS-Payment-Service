replicaCount: 2

image:
  repository: 113831246313.dkr.ecr.us-east-1.amazonaws.com/payment-service
  tag: "v1"
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: payment-service

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

resources: {}